{% extends "base.html" %}

{% load static %}

{% block title %}Login{% endblock %}

{% block head %}

<style>

    html,
    body {
        margin: 0 !important;
        padding: 0 !important;
        border: 0 !important;
        border-top: 0 !important;
    }

    .login-page {
        width: 100% !important;
        min-height: 100vh !important;

        margin: 0 !important;
        padding: 40px 20px !important;

        box-sizing: border-box !important;

        background-color: #f1f3f5 !important;

        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
    }

    .login-box {
        width: 100% !important;
        max-width: 650px !important;

        box-sizing: border-box !important;

        background-color: #ffffff !important;

        padding: 40px !important;

        border-radius: 16px !important;

        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10) !important;
    }

    .login-logo {
        text-align: center !important;
        margin-bottom: 30px !important;
    }

    .login-logo img {
        display: block !important;

        max-width: 150px !important;
        max-height: 100px !important;

        margin: 0 auto 10px auto !important;
    }

    .login-logo label {
        display: block !important;

        margin: 0 !important;

        font-family: Arial, sans-serif !important;
        font-size: 20px !important;
        font-weight: 600 !important;

        color: #222222 !important;
    }

    .login-titulo {
        margin: 0 0 30px 0 !important;

        text-align: center !important;

        font-family: Arial, sans-serif !important;
        font-size: 32px !important;
        font-weight: 700 !important;

        color: #222222 !important;
    }

    .login-campo {
        width: 100% !important;

        margin-bottom: 22px !important;
    }

    .login-campo label {
        display: block !important;

        margin-bottom: 8px !important;

        font-family: Arial, sans-serif !important;
        font-size: 14px !important;
        font-weight: 600 !important;

        color: #333333 !important;
    }

    .login-campo input {
        width: 100% !important;

        height: 48px !important;

        box-sizing: border-box !important;

        padding: 0 14px !important;

        border: 1px solid #d1d5db !important;
        border-radius: 8px !important;

        background-color: #ffffff !important;

        font-family: Arial, sans-serif !important;
        font-size: 15px !important;

        color: #222222 !important;

        outline: none !important;
    }

    .login-campo input:focus {
        border-color: #2563eb !important;

        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15) !important;
    }

    .login-botoes {
        width: 100% !important;

        display: flex !important;

        flex-direction: column !important;

        gap: 12px !important;

        margin-top: 5px !important;
    }

    .login-botao {
        width: 100% !important;

        height: 50px !important;

        border: none !important;
        border-radius: 8px !important;

        background-color: #2563eb !important;

        color: #000000 !important;

        font-family: Arial, sans-serif !important;
        font-size: 16px !important;
        font-weight: 700 !important;

        cursor: pointer !important;

        text-align: center !important;

        transition: 0.2s ease !important;
    }

    .login-botao:hover {
        background-color: #1d4ed8 !important;

        transform: translateY(-1px) !important;
    }

    .login-cadastro {
        display: flex !important;

        width: 100% !important;
        height: 50px !important;

        box-sizing: border-box !important;

        align-items: center !important;
        justify-content: center !important;

        border: 1px solid #2563eb !important;

        border-radius: 8px !important;

        background-color: #ffffff !important;

        color: #2563eb !important;

        font-family: Arial, sans-serif !important;
        font-size: 16px !important;
        font-weight: 600 !important;

        text-decoration: none !important;

        transition: 0.2s ease !important;
    }

    .login-cadastro:hover {
        background-color: #eff6ff !important;

        color: #1d4ed8 !important;
    }

    .login-mensagens {
        width: 100% !important;

        margin-bottom: 20px !important;
    }

    .login-mensagem {
        box-sizing: border-box !important;

        width: 100% !important;

        padding: 12px 15px !important;

        margin-bottom: 8px !important;

        border-radius: 8px !important;

        background-color: #fee2e2 !important;

        border: 1px solid #fecaca !important;

        color: #b91c1c !important;

        font-family: Arial, sans-serif !important;
        font-size: 14px !important;
    }

    @media (max-width: 600px) {

        .login-page {
            padding: 20px 12px !important;
        }

        .login-box {
            padding: 25px 20px !important;
        }

        .login-titulo {
            font-size: 28px !important;
        }

    }

</style>

{% endblock %}


{% block body %}

<div class="login-page">

    <!-- CAIXA BRANCA -->
    <div class="login-box">

        <!-- LOGO -->
        <div class="login-logo">

            <img
                src="{% static 'geral/img/logo.png' %}"
                alt="Logo"
            >

            <label>
                Treinamento-Pacer
            </label>

        </div>


        <!-- TÍTULO -->
        <h1 class="login-titulo">
            Logar
        </h1>


        <!-- MENSAGENS -->
        {% if messages %}

            <div class="login-mensagens">

                {% for message in messages %}

                    <div class="login-mensagem">
                        {{ message }}
                    </div>

                {% endfor %}

            </div>

        {% endif %}


        <!-- FORMULÁRIO -->
        <form
            action="{% url 'login' %}"
            method="post"
        >

            {% csrf_token %}


            <!-- USERNAME -->
            <div class="login-campo">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Username ..."
                    value="{{ request.POST.username }}"
                >

            </div>


            <!-- SENHA -->
            <div class="login-campo">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha ..."
                >

            </div>


            <!-- BOTÕES -->
            <div class="login-botoes">

                <!-- LOGAR -->
                <button
                    type="submit"
                    class="login-botao"
                >
                    Logar
                </button>


                <!-- CADASTRO -->
                <a
                    href="{% url 'cadastro' %}"
                    class="login-cadastro"
                >
                    Não possuo uma conta
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
